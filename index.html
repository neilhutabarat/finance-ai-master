<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oneilverse - Portal Masuk Otorisasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }
        .ios-glass {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
    <div class="ios-glass w-full max-w-md p-7 sm:p-8 shadow-2xl space-y-6 text-center">
        <!-- Brand -->
        <div class="space-y-2">
            <div id="login-logo-trigger" class="w-16 h-16 rounded-[20px] bg-white/10 text-white flex items-center justify-center text-2xl font-black shadow-[0_4px_30px_rgba(0,0,0,0.1)] backdrop-blur-md mx-auto border border-white/30 cursor-default select-none relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-white/40 group-active:opacity-50 transition-opacity"></div>
                <span id="login-emoji" class="z-10 bg-clip-text text-transparent bg-gradient-to-br from-indigo-50 to-slate-200 drop-shadow-sm font-sans tracking-tighter">ON</span>
            </div>
            <h1 id="login-brand" class="text-2xl font-black text-slate-900 tracking-tight">Oneilverse</h1>
            <p id="login-sub" class="text-xs text-slate-500 font-medium">Financial Hub & Otorisasi Sistem Enterprise</p>
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-black bg-indigo-100 text-indigo-800 border border-indigo-200 uppercase tracking-widest">
                ID26110901
            </span>
        </div>

        <!-- Role Selector Buttons -->
        <div class="space-y-3 pt-2">
            <label class="text-xs font-bold text-slate-600 block text-left">Pilih Akses / Jabatan:</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectRole('staff')" id="role-btn-staff" class="py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-900 transition active:scale-95">
                    Kasir
                </button>
                <button type="button" onclick="selectRole('manager')" id="role-btn-manager" class="py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 text-slate-600 hover:border-purple-600 transition active:scale-95">
                    Manager
                </button>
                <button type="button" onclick="selectRole('owner')" id="role-btn-owner" class="py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 text-slate-600 hover:border-slate-900 transition active:scale-95">
                    Owner
                </button>
            </div>
        </div>

        <!-- PIN Input -->
        <div class="space-y-2">
            <div class="flex justify-between items-center text-xs">
                <label class="font-bold text-slate-700">Masukkan PIN Keamanan:</label>
                
            </div>
            <input type="password" id="input-pin" maxlength="6" placeholder="• • • •" class="w-full text-center tracking-[0.5em] text-2xl font-black bg-slate-50 border-2 border-slate-200 rounded-2xl p-3.5 outline-none focus:border-indigo-600 transition focus:bg-white" autofocus>
        </div>

        <!-- Submit Button -->
        <button onclick="handleLogin()" id="btn-login-submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-xl shadow-slate-900/20 transition active:scale-98 flex items-center justify-center space-x-2">
            <span>Masuk ke Sistem</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

        <p class="text-[11px] text-slate-400 pt-1">
            Kasir: <b>kasir.html</b> • Manager: <b>manager.html</b> • Owner: <b>dashboard.html</b>
        </p>
    </div>

    <script src="js/tenants.js"></script>
    <script src="js/config.js?v=18.0"></script>
    <script src="js/core.js?v=18.0"></script>
    <script>
        let currentRole = 'staff';
        const urlParams = new URLSearchParams(window.location.search);
        const tokoParam = urlParams.get('toko') ? `?toko=${encodeURIComponent(urlParams.get('toko'))}` : '';

        function selectRole(role) {
            currentRole = role;
            ['staff', 'manager', 'owner'].forEach(r => {
                const b = document.getElementById(`role-btn-${r}`);
                if (r === role) {
                    b.className = r === 'manager' 
                        ? "py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-purple-600 bg-purple-50 text-purple-900 shadow-sm"
                        : r === 'owner'
                        ? "py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-slate-900 bg-slate-100 text-slate-900 shadow-sm"
                        : "py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-900 shadow-sm";
                } else {
                    b.className = "py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 text-slate-600 hover:border-slate-400";
                }
            });

            const hint = document.getElementById('pin-hint');
            if (role === 'staff') hint.innerText = "Default: 1234";
            else if (role === 'manager') hint.innerText = "Default: 5678";
            else hint.innerText = "Default: 9999 / 0000";

            document.getElementById('input-pin').value = "";
            document.getElementById('input-pin').focus();
        }

        function handleLogin() {
            const pin = document.getElementById('input-pin').value.trim();
            if (!pin) return alert("Masukkan PIN terlebih dahulu!");

            let userObj = null;
            let targetUrl = "kasir.html";

            if (currentRole === 'staff') {
                if (pin === "1234" || pin === "0000") {
                    userObj = { role: 'staff', title: 'Staf Kasir', permissions: ['kasir'] };
                    targetUrl = "kasir.html";
                } else {
                    return alert("PIN Kasir salah! (Default: 1234)");
                }
            } else if (currentRole === 'manager') {
                if (pin === "5678" || pin === "1234") {
                    userObj = { role: 'manager', title: 'Supervisor / Manager', permissions: ['kasir', 'manager', 'audit'] };
                    // ROUTING DIPERBAIKI: Manager masuk ke manager.html!
                    targetUrl = "manager.html";
                } else {
                    return alert("PIN Manager salah! (Default: 5678)");
                }
            } else if (currentRole === 'owner') {
                if (pin === "9999" || pin === "0000" || pin === "1234" || pin === "5678") {
                    userObj = { role: 'owner', title: 'Owner Eksekutif', permissions: ['kasir', 'manager', 'owner', 'audit', 'prive'] };
                    targetUrl = "dashboard.html";
                } else {
                    return alert("PIN Owner salah! (Default: 9999 / 0000)");
                }
            }

            // Simpan sesi autentikasi ke localStorage
            localStorage.setItem('currentUser', JSON.stringify(userObj));
            localStorage.setItem('auth_role', userObj.role);
            localStorage.setItem('auth_title', userObj.title);

            // Buka halaman tujuan
            window.location.href = targetUrl + tokoParam;
        }

        // Enter key to submit
        document.getElementById('input-pin').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        
        let logoTapCount = 0;
        let tapTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('login-logo-trigger');
            if (logo) {
                logo.addEventListener('click', () => {
                    const tenantID = document.getElementById('login-brand') ? document.getElementById('login-brand').innerText : 'Oneilverse';
                    if (tenantID.includes('Oneilverse') || tenantID.includes('ID26110901')) {
                        logoTapCount++;
                        clearTimeout(tapTimeout);
                        
                        if (logoTapCount >= 7) {
                            logoTapCount = 0;
                            const pin = prompt("Pintu Rahasia Provider.
Masukkan 6 Angka Kode:");
                            if (pin === "930223") {
                                const prov = { role: 'superadmin', title: 'Platform Provider' };
                                localStorage.setItem('currentUser', JSON.stringify(prov));
                                localStorage.setItem('auth_role', 'superadmin');
                                window.location.replace("provider.html");
                            } else {
                                alert("Kode Tidak Valid.");
                            }
                        }
                        
                        tapTimeout = setTimeout(() => { logoTapCount = 0; }, 1500);
                    }
                });
            }
            lucide.createIcons();
            const activeTenant = (typeof getActiveTenant === 'function') ? getActiveTenant() : null;
            if (activeTenant) {
                document.getElementById('login-brand').innerText = activeTenant.nama;
                document.getElementById('login-sub').innerText = activeTenant.slogan;
                if (activeTenant.logoText && activeTenant.logoText !== "⚡") {
                    document.getElementById('login-emoji').innerText = activeTenant.logoText;
                }
            }
        });

    </script>
</body>
</html>
