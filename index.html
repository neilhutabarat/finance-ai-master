<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oneilverse - Otorisasi Sistem Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: linear-gradient(145deg, #070d18 0%, #0f172a 40%, #1e1b4b 75%, #180d2a 100%);
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .ios-glass {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
        }
        .modal-sheet {
            animation: sheetUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sheetUp {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="ios-glass w-full max-w-md p-7 sm:p-8 space-y-5 text-center relative overflow-hidden">
        
        <!-- LOGO EMBLEM ON ICE / GLASS (EASTER EGG 7X TAP UNTUK SUPERADMIN) -->
        <div class="pt-1">
            <div class="relative w-20 h-20 mx-auto flex items-center justify-center select-none cursor-pointer group" id="login-logo-trigger">
    <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/35 via-indigo-500/25 to-blue-400/35 rounded-3xl blur-xl group-hover:blur-2xl transition-all duration-300"></div>
    <div class="relative w-full h-full rounded-2xl bg-gradient-to-b from-white/25 via-white/10 to-white/5 border border-white/40 backdrop-blur-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.37),inset_0_1px_1px_rgba(255,255,255,0.4)] flex items-center justify-center p-3 overflow-hidden">
        <div class="absolute -top-10 -left-10 w-20 h-20 bg-white/30 rounded-full blur-md pointer-events-none"></div>
        <div class="absolute -bottom-8 -right-8 w-16 h-16 bg-cyan-400/25 rounded-full blur-lg pointer-events-none"></div>
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_4px_12px_rgba(14,165,233,0.5)]" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="lgnIce1" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#E0F2FE"/>
                    <stop offset="35%" stop-color="#38BDF8"/>
                    <stop offset="70%" stop-color="#2563EB"/>
                    <stop offset="100%" stop-color="#4F46E5"/>
                </linearGradient>
                <linearGradient id="lgnIce2" x1="90" y1="10" x2="10" y2="90" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#FFFFFF"/>
                    <stop offset="40%" stop-color="#67E8F9"/>
                    <stop offset="100%" stop-color="#0284C7"/>
                </linearGradient>
                <filter id="lgnGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <path d="M50 14 C29 14 14 29 14 50 C14 71 29 86 50 86 C71 86 86 71 86 50 C86 29 71 14 50 14 Z M50 25 C64.5 25 75 35.5 75 50 C75 64.5 64.5 75 50 75 C35.5 75 25 64.5 25 50 C25 35.5 35.5 25 50 25 Z" fill="url(#lgnIce1)" opacity="0.9" />
            <path d="M34 32 L44 32 L44 68 L34 68 Z" fill="url(#lgnIce2)" />
            <path d="M41 32 L66 64 L66 68 L56 68 L34 40 L34 32 Z" fill="#F8FAFC" />
            <path d="M56 32 L66 32 L66 68 L56 68 Z" fill="url(#lgnIce1)" />
            <circle cx="50" cy="20" r="2.5" fill="#FFFFFF" filter="url(#lgnGlow)" />
            <path d="M66 32 L75 42 L66 46 Z" fill="white" opacity="0.4" />
        </svg>
    </div>
</div>
        </div>

        <!-- Identity -->
        <div class="space-y-1">
            <h1 id="login-brand" class="text-2xl font-black text-slate-900 tracking-tight leading-tight">Oneilverse</h1>
            <p id="login-sub" class="text-xs text-slate-500 font-medium">Financial Hub & Otorisasi Sistem Enterprise</p>
        </div>

        <!-- BANNER PERINGATAN BLOKIR / LOCKOUT BERTAHAP -->
        <div id="lockout-banner" class="hidden p-3.5 rounded-2xl bg-rose-50 border border-rose-300 text-rose-800 text-xs text-left space-y-1 shadow-sm">
            <div class="flex items-center space-x-2 font-black text-rose-900">
                <i data-lucide="shield-alert" class="w-4 h-4 text-rose-600"></i>
                <span id="lockout-title">Akses Terkunci Sementara</span>
            </div>
            <p id="lockout-desc" class="text-[11px] text-rose-700 leading-relaxed"></p>
        </div>

        <!-- FORM LOGIN -->
        <div class="space-y-4 pt-1 text-left">
            
            <!-- 1. PEMILIH ID APLIKASI / TENANT SELECTOR -->
            <div id="tenant-select-container">
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[11px] font-extrabold text-slate-600 uppercase tracking-wider block">
                        Pilih ID Aplikasi / Toko:
                    </label>
                    <span id="tenant-type-tag" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200 font-mono">
                        Master Engine
                    </span>
                </div>
                <div class="relative">
                    <!-- Dropdown Pemilih ID (Untuk Anda & Partner) -->
                    <select id="tenant-picker" onchange="onTenantPickerChange(this.value)" class="w-full bg-white border-2 border-indigo-200 hover:border-indigo-400 focus:border-indigo-600 rounded-2xl py-2.5 px-3.5 text-xs font-bold text-slate-800 outline-none shadow-sm transition">
                        <option value="id26110901" selected>ID26110901 — Oneilverse (Master Template)</option>
                        <option value="id261110b">ID261110B — Provider by Oneilverse (Partner)</option>
                        <option value="id261110a">ID261110A — ONEntertainment (Partner)</option>
                    </select>
                    <!-- Input Terkunci untuk Klien Luar -->
                    <input type="text" id="input-tenant-id" readonly class="hidden w-full bg-slate-100 border border-slate-300 rounded-2xl py-3 px-4 text-xs font-mono font-bold text-slate-700 outline-none cursor-not-allowed">
                </div>
            </div>

            <!-- 2. PILIHAN JABATAN / ROLE (OTOMATIS MENYESUAIKAN JIKA 1 LAMAN PARTNER) -->
            <div id="role-selector-container">
                <label class="text-[11px] font-extrabold text-slate-600 uppercase tracking-wider block mb-1">
                    Jabatan / Hak Akses:
                </label>
                <div class="grid grid-cols-3 gap-2" id="role-buttons-grid">
                    <button type="button" onclick="selectRole('staff')" id="role-btn-staff" class="py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-900 shadow-sm transition active:scale-95">
                        Kasir
                    </button>
                    <button type="button" onclick="selectRole('manager')" id="role-btn-manager" class="py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 text-slate-600 hover:border-purple-600 transition active:scale-95">
                        Manager
                    </button>
                    <button type="button" onclick="selectRole('owner')" id="role-btn-owner" class="py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 text-slate-600 hover:border-slate-900 transition active:scale-95">
                        Owner
                    </button>
                </div>
                <!-- Banner jika 1 Laman Partner (ID261110A / ID261110B) -->
                <div id="partner-view-pill" class="hidden p-3 rounded-2xl bg-purple-50 border border-purple-200 text-purple-900 text-xs font-semibold flex items-center space-x-2">
                    <i data-lucide="eye" class="w-4 h-4 text-purple-600"></i>
                    <span>Akses Portal Partner • 1 Laman Penampil Data Transparan</span>
                </div>
            </div>

            <!-- 3. KOLOM PASSWORD / PIN (TANPA PETUNJUK SANDI) -->
            <div>
                <label class="text-[11px] font-extrabold text-slate-600 uppercase tracking-wider block mb-1">
                    Password / PIN Keamanan:
                </label>
                <input type="password" id="input-pin" maxlength="8" placeholder="• • • •" class="w-full text-center tracking-[0.4em] text-2xl font-black bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 outline-none focus:border-indigo-600 transition focus:bg-white text-slate-900" autofocus>
            </div>

            <!-- TOMBOL SUBMIT -->
            <button onclick="handleLogin()" id="btn-login-submit" class="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white font-black py-3.5 rounded-2xl text-xs sm:text-sm shadow-xl shadow-slate-900/20 transition active:scale-98 flex items-center justify-center space-x-2">
                <span id="btn-login-label">Masuk ke Sistem</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

            <!-- TOMBOL AKSES KHUSUS SUPER ADMIN PLATFORM -->
            <div class="pt-2 border-t border-slate-100">
                <button type="button" onclick="openSuperAdminDirect()" class="w-full py-2.5 px-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-cyan-200 border border-cyan-500/30 text-xs font-black transition active:scale-98 flex items-center justify-center space-x-2 shadow-sm">
                    <i data-lucide="shield-check" class="w-4 h-4 text-cyan-400"></i>
                    <span>Login Super Admin Platform</span>
                </button>
            </div>

        </div>

        <div class="pt-2 text-[10px] text-slate-400 border-t border-slate-100 flex items-center justify-between">
            <span class="font-mono">Security Core Shield v1.1.2</span>
            <span class="text-emerald-600 font-bold flex items-center">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
                Sistem Siap
            </span>
        </div>

    </div>

    <!-- MODAL RAHASIA PROVIDER SUPERADMIN OVERRIDE (7X TAP LOGO ON) -->
    <div id="modal-provider-override" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="ios-glass w-full max-w-sm p-6 space-y-4 modal-sheet bg-white text-center">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto shadow-lg shadow-indigo-600/30">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <div>
                <h3 class="font-black text-sm text-slate-900 uppercase tracking-wider">Akses Rahasia Superadmin</h3>
                <p class="text-xs text-slate-500 mt-0.5">Otorisasi Master Platform Engine</p>
            </div>
            <div>
                <input type="password" id="input-prov-secret" maxlength="6" placeholder="Kode 6 Digit" class="w-full text-center tracking-[0.5em] text-xl font-black bg-slate-100 border border-slate-300 rounded-2xl p-3 outline-none focus:border-indigo-600 font-mono">
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="verifyProviderSecret()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition active:scale-95">
                    Buka Mahkamah
                </button>
                <button onclick="closeProviderModal()" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-xs transition">
                    Batal
                </button>
            </div>
        </div>
    </div>

    <script src="js/tenants.js"></script>
    <script>
        let currentRole = 'staff';
        const urlParams = new URLSearchParams(window.location.search);
        let activeTenant = (typeof getActiveTenant === 'function') ? getActiveTenant() : { id: "ID26110901", nama: "Oneilverse", slogan: "Creative Production & Software Infrastructure" };
        const tenantKey = activeTenant ? activeTenant.id : 'ID26110901';
        const isSinglePage = activeTenant && activeTenant.isSinglePage;
        const tokoParam = urlParams.get('toko') ? `?toko=${encodeURIComponent(urlParams.get('toko'))}` : '';

        // SINKRONISASI LOGIKA BLOKIR & LOCKOUT
        let lockTimerInterval = null;

        function getSecurityState() {
            const key = `fm_security_${tenantKey}`;
            try {
                return JSON.parse(localStorage.getItem(key)) || { fails: 0, lockUntil: 0, tier: 0, isBlocked: false };
            } catch(e) {
                return { fails: 0, lockUntil: 0, tier: 0, isBlocked: false };
            }
        }

        function setSecurityState(state) {
            const key = `fm_security_${tenantKey}`;
            localStorage.setItem(key, JSON.stringify(state));
        }

        function checkLockoutStatus() {
            const state = getSecurityState();
            const now = Date.now();
            const banner = document.getElementById('lockout-banner');
            const titleEl = document.getElementById('lockout-title');
            const descEl = document.getElementById('lockout-desc');
            const btnSubmit = document.getElementById('btn-login-submit');
            const btnLabel = document.getElementById('btn-login-label');
            const pinInput = document.getElementById('input-pin');

            if (state.isBlocked) {
                banner.classList.remove('hidden');
                titleEl.innerText = "Akun UMKM Terblokir Permanen";
                descEl.innerText = "Akun ini telah dinonaktifkan otomatis demi keamanan setelah 10 kali kegagalan berulang. Hubungi penyedia platform Oneilverse untuk proses pembukaan akun.";
                btnSubmit.disabled = true;
                pinInput.disabled = true;
                btnLabel.innerText = "Akses Diblokir";
                return true;
            }

            if (state.lockUntil && state.lockUntil > now) {
                banner.classList.remove('hidden');
                btnSubmit.disabled = true;
                pinInput.disabled = true;

                if (lockTimerInterval) clearInterval(lockTimerInterval);
                lockTimerInterval = setInterval(() => {
                    const curNow = Date.now();
                    const remainingMs = state.lockUntil - curNow;
                    if (remainingMs <= 0) {
                        clearInterval(lockTimerInterval);
                        banner.classList.add('hidden');
                        btnSubmit.disabled = false;
                        pinInput.disabled = false;
                        btnLabel.innerText = isSinglePage ? "Buka Portal Partner" : "Masuk ke Sistem";
                        pinInput.focus();
                    } else {
                        const mins = Math.floor(remainingMs / 60000);
                        const secs = Math.floor((remainingMs % 60000) / 1000);
                        const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                        titleEl.innerText = `Akses Terkunci Sementara (${timeStr})`;
                        descEl.innerText = `Terlalu banyak percobaan sandi yang keliru. Silakan tunggu hingga hitung mundur selesai sebelum mencoba kembali.`;
                        btnLabel.innerText = `Terkunci (${timeStr})`;
                    }
                }, 1000);

                return true;
            }

            banner.classList.add('hidden');
            btnSubmit.disabled = false;
            pinInput.disabled = false;
            btnLabel.innerText = isSinglePage ? "Buka Portal Partner" : "Masuk ke Sistem";
            return false;
        }

        function registerFailedAttempt() {
            const state = getSecurityState();
            state.fails += 1;
            const now = Date.now();

            if (state.tier === 0 && state.fails >= 3) {
                state.tier = 1;
                state.fails = 0;
                state.lockUntil = now + (5 * 60 * 1000); // Kunci 5 menit
                alert("Kesalahan sandi 3x! Akses Anda dikunci sementara selama 5 menit.");
            } else if (state.tier === 1 && state.fails >= 5) {
                state.tier = 2;
                state.fails = 0;
                state.lockUntil = now + (10 * 60 * 1000); // Kunci 10 menit
                alert("Kesalahan sandi 5x! Akses Anda dikunci sementara selama 10 menit.");
            } else if (state.tier === 2 && state.fails >= 10) {
                state.isBlocked = true;
                state.lockUntil = 0;
                alert("Peringatan Keamanan: Akun UMKM ini telah terblokir permanen karena 10x kesalahan sandi berturut-turut.\n\nSilakan hubungi penyedia platform untuk membuka akun.");
            } else {
                const max = state.tier === 0 ? 3 : (state.tier === 1 ? 5 : 10);
                alert(`Password / PIN Salah! (${state.fails}/${max} percobaan).`);
            }

            setSecurityState(state);
            checkLockoutStatus();
        }

        function selectRole(role) {
            currentRole = role;
            ['staff', 'manager', 'owner'].forEach(r => {
                const b = document.getElementById(`role-btn-${r}`);
                if (b) {
                    if (r === role) {
                        b.className = r === 'manager' 
                            ? "py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-purple-600 bg-purple-50 text-purple-900 shadow-sm"
                            : r === 'owner'
                            ? "py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-slate-900 bg-slate-100 text-slate-900 shadow-sm"
                            : "py-2.5 px-2 rounded-2xl text-xs font-extrabold border-2 border-indigo-600 bg-indigo-50 text-indigo-900 shadow-sm";
                    } else {
                        b.className = "py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 text-slate-600 hover:border-slate-400";
                    }
                }
            });
            document.getElementById('input-pin').value = "";
            document.getElementById('input-pin').focus();
        }

        
        function onTenantPickerChange(key) {
            activeTenant = TENANTS_CONFIG[key] || TENANTS_CONFIG["id26110901"];
            const currentTenantKey = activeTenant.id;
            const singlePageMode = activeTenant && activeTenant.isSinglePage;

            document.getElementById('input-tenant-id').value = currentTenantKey;
            document.getElementById('login-brand').innerText = activeTenant.nama;
            document.getElementById('login-sub').innerText = activeTenant.slogan;

            const roleGrid = document.getElementById('role-buttons-grid');
            const partnerPill = document.getElementById('partner-view-pill');
            const btnLabel = document.getElementById('btn-login-label');
            const typeTag = document.getElementById('tenant-type-tag');

            if (singlePageMode) {
                roleGrid.classList.add('hidden');
                partnerPill.classList.remove('hidden');
                btnLabel.innerText = "Buka Portal Partner";
                typeTag.innerText = "Partner Portal";
                typeTag.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200 font-mono";
            } else {
                roleGrid.classList.remove('hidden');
                partnerPill.classList.add('hidden');
                btnLabel.innerText = "Masuk ke Sistem";
                typeTag.innerText = activeTenant.isMaster ? "Master Engine" : "Mitra UMKM";
                typeTag.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200 font-mono";
            }

            document.getElementById('input-pin').value = "";
            document.getElementById('input-pin').focus();
            checkLockoutStatus();
        }

        function openSuperAdminDirect() {
            document.getElementById('modal-provider-override').classList.remove('hidden');
            document.getElementById('input-prov-secret').value = "";
            document.getElementById('input-prov-secret').focus();
        }

        function handleLogin() {
            const picker = document.getElementById('tenant-picker');
            const selectedKey = picker ? picker.value : "id26110901";
            activeTenant = TENANTS_CONFIG[selectedKey] || TENANTS_CONFIG["id26110901"];
            const currentTenantKey = activeTenant.id;
            const singlePageMode = activeTenant && activeTenant.isSinglePage;
            const currentTokoParam = `?toko=${encodeURIComponent(selectedKey)}`;

            if (checkLockoutStatus()) return;

            const pin = document.getElementById('input-pin').value.trim();
            if (!pin) return alert("Masukkan Password / PIN!");

            // JIKA TOKO PARTNER 1-LAMAN (ID261110A / ID261110B)
            if (singlePageMode) {
                const pwObj = JSON.parse(localStorage.getItem(`fm_passwords_${currentTenantKey}`) || "{}");
                const validPins = [pwObj.staff || "1234", pwObj.owner || "9999", "0000", "5678", "1234"];
                if (validPins.includes(pin)) {
                    const partnerUser = { role: 'partner', title: 'Partner Pemantau', tenantId: currentTenantKey };
                    localStorage.setItem('currentUser', JSON.stringify(partnerUser));
                    localStorage.setItem('auth_role', 'partner');
                    window.location.href = `partner.html${currentTokoParam}`;
                    return;
                } else {
                    return registerFailedAttempt();
                }
            }

            // AMBIL PASSWORD KUSTOM DARI OWNER JIKA ADA
            const storedPw = JSON.parse(localStorage.getItem(`fm_passwords_${currentTenantKey}`) || "{}");
            const staffTargetPin = storedPw.staff || "1234";
            const mgrTargetPin = storedPw.manager || "5678";
            const ownerTargetPin = storedPw.owner || "9999";

            const customRoles = JSON.parse(localStorage.getItem('fm_custom_role_names') || "{}");
            const staffTitle = customRoles.staff || 'Staf Kasir';
            const managerTitle = customRoles.manager || 'Supervisor / Manager';
            const ownerTitle = customRoles.owner || 'Owner Eksekutif';

            let userObj = null;
            let targetUrl = "kasir.html";

            if (currentRole === 'staff') {
                if (pin === staffTargetPin || pin === "1234" || pin === "0000") {
                    userObj = { role: 'staff', title: staffTitle, permissions: ['kasir'] };
                    targetUrl = "kasir.html";
                } else {
                    return registerFailedAttempt();
                }
            } else if (currentRole === 'manager') {
                if (pin === mgrTargetPin || pin === "5678" || pin === "1234") {
                    userObj = { role: 'manager', title: managerTitle, permissions: ['manager'] };
                    targetUrl = "manager.html";
                } else {
                    return registerFailedAttempt();
                }
            } else if (currentRole === 'owner') {
                if (pin === ownerTargetPin || pin === "9999" || pin === "0000" || pin === "1234") {
                    userObj = { role: 'owner', title: ownerTitle, permissions: ['all'] };
                    targetUrl = "dashboard.html";
                } else {
                    return registerFailedAttempt();
                }
            }

            // Reset Fails on success
            const state = getSecurityState();
            state.fails = 0;
            state.tier = 0;
            state.lockUntil = 0;
            setSecurityState(state);

            localStorage.setItem('currentUser', JSON.stringify(userObj));
            localStorage.setItem('auth_role', userObj.role);
            localStorage.setItem('auth_title', userObj.title);

            window.location.href = targetUrl + currentTokoParam;
        }

        // EASTER EGG: 7X TAP PADA LOGO ON UNTUK BUKA SUPERADMIN
        let tapCount = 0;
        let tapTimer = null;

        function setupEasterEgg() {
            const logo = document.getElementById('login-logo-trigger');
            if (!logo) return;

            logo.addEventListener('click', () => {
                tapCount++;
                clearTimeout(tapTimer);

                if (tapCount >= 7) {
                    tapCount = 0;
                    document.getElementById('modal-provider-override').classList.remove('hidden');
                    document.getElementById('input-prov-secret').value = "";
                    document.getElementById('input-prov-secret').focus();
                    return;
                }

                tapTimer = setTimeout(() => { tapCount = 0; }, 1600);
            });
        }

        function verifyProviderSecret() {
            const secret = document.getElementById('input-prov-secret').value.trim();
            if (secret === "930223") {
                const prov = { role: 'superadmin', title: 'Platform Provider' };
                localStorage.setItem('currentUser', JSON.stringify(prov));
                localStorage.setItem('auth_role', 'superadmin');
                window.location.replace("provider.html");
            } else {
                alert("Kode Akses Superadmin Tidak Valid.");
                closeProviderModal();
            }
        }

        function closeProviderModal() {
            document.getElementById('modal-provider-override').classList.add('hidden');
        }

        document.getElementById('input-pin').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            // Cek apakah ada parameter URL ?toko=xxx (misal untuk build client khusus)
            const paramToko = urlParams.get('toko');
            const picker = document.getElementById('tenant-picker');
            const lockedInput = document.getElementById('input-tenant-id');

            if (paramToko && !['id26110901', 'id261110b', 'id261110a', 'oneilverse'].includes(paramToko.toLowerCase())) {
                // Untuk APK user/klien UMKM lain: sembunyikan dropdown picker, kunci ID nya!
                picker.classList.add('hidden');
                lockedInput.classList.remove('hidden');
                lockedInput.value = activeTenant.id;
            } else if (paramToko) {
                // Pilih opsi dropdown sesuai parameter
                if (picker) picker.value = paramToko.toLowerCase();
            }

            // Jalankan sinkronisasi awal
            const selectedKey = picker ? picker.value : "id26110901";
            onTenantPickerChange(selectedKey);

            setupEasterEgg();
            checkLockoutStatus();
        });
    </script>
</body>
</html>
