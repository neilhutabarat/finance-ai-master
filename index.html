    <style>
        :root {
            --app-bg: #f1f5f9;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--app-bg);
            background-image: 
                radial-gradient(at 10% 10%, rgba(224, 242, 254, 0.8) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(238, 242, 255, 0.8) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 60%);
            color: #0f172a;
            padding-bottom: 44px;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* 3D White Ice Glass Card dengan Efek Kilap Mewah */
        .white-ice-glass-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(241, 245, 249, 0.82) 50%, rgba(255, 255, 255, 0.88) 100%);
            
            
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-top: 1.5px solid rgba(255, 255, 255, 1);
            border-left: 1.5px solid rgba(255, 255, 255, 0.9);
            border-bottom: 1.5px solid rgba(203, 213, 225, 0.5);
            border-right: 1.5px solid rgba(203, 213, 225, 0.4);
            border-radius: 32px;
            /* 3D Depth Layered Shadows */
            box-shadow: 
                0 20px 40px -15px rgba(15, 23, 42, 0.12),
                0 35px 60px -20px rgba(99, 102, 241, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.95),
                inset 0 -2px 6px rgba(203, 213, 225, 0.25);
            color: #0f172a;
            overflow: hidden;
        }

        /* Pantulan Cahaya Kilap Diagonal (Gloss Sheen Reflection) */
        .white-ice-glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 48%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.08) 100%);
            border-radius: 32px 32px 100px 100px / 32px 32px 30px 30px;
            pointer-events: none;
            z-index: 1;
        }

        /* Glass Input Fields - Teks Sangat Jelas & Tajam */
        .glass-input {
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(203, 213, 225, 0.8);
            color: #0f172a;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15), inset 0 1px 2px rgba(0,0,0,0.02);
        }

        /* Modal Sheet */
        .modal-sheet-glass {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.96) 0%, rgba(248, 250, 252, 0.92) 100%);
            
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-top: 2px solid #ffffff;
            box-shadow: 0 30px 70px -15px rgba(15, 23, 42, 0.25);
            border-radius: 28px;
            animation: sheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sheetUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* News Ticker Marquee */
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 160s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>

    <script>
        let currentRole = 'staff';
        const urlParams = new URLSearchParams(window.location.search);
        let activeTenant = (typeof getActiveTenant === 'function') ? getActiveTenant() : { id: "ID26110901", nama: "Oneilverse", slogan: "Creative Production & Software Infrastructure" };
        let tenantKey = activeTenant ? activeTenant.id : 'ID26110901';

        function getSecurityState() {
            const key = `fm_security_${tenantKey}`;
            try {
                return JSON.parse(localStorage.getItem(key)) || { fails: 0, lockUntil: 0, tier: 0, isBlocked: false };
            } catch(e) {
                return { fails: 0, lockUntil: 0, tier: 0, isBlocked: false };
            }
        }

        function setSecurityState(state) {
            const key = `fm_security_${tenantKey}`;
            localStorage.setItem(key, JSON.stringify(state));
        }

        let lockTimerInterval = null;
        function checkLockoutStatus() {
            const state = getSecurityState();
            const now = Date.now();
            const banner = document.getElementById('lockout-banner');
            const titleEl = document.getElementById('lockout-title');
            const descEl = document.getElementById('lockout-desc');
            const btnSubmit = document.getElementById('btn-login-submit');
            const btnLabel = document.getElementById('btn-login-label');
            const pinInput = document.getElementById('input-pin');

            if (state.isBlocked) {
                banner.classList.remove('hidden');
                titleEl.innerText = "Akun UMKM Terblokir Permanen";
                descEl.innerText = "Akun ini telah dinonaktifkan otomatis demi keamanan setelah 10 kali kegagalan berulang. Hubungi penyedia platform Oneilverse untuk proses pembukaan akun.";
                btnSubmit.disabled = true;
                pinInput.disabled = true;
                btnLabel.innerText = "Akses Diblokir";
                return true;
            }

            if (state.lockUntil && state.lockUntil > now) {
                banner.classList.remove('hidden');
                btnSubmit.disabled = true;
                pinInput.disabled = true;

                if (lockTimerInterval) clearInterval(lockTimerInterval);
                lockTimerInterval = setInterval(() => {
                    const curNow = Date.now();
                    const remainingMs = state.lockUntil - curNow;
                    if (remainingMs <= 0) {
                        clearInterval(lockTimerInterval);
                        banner.classList.add('hidden');
                        btnSubmit.disabled = false;
                        pinInput.disabled = false;
                        btnLabel.innerText = activeTenant.isSinglePage ? "Buka Portal Partner" : "Masuk ke Sistem";
                        pinInput.focus();
                    } else {
                        const mins = Math.floor(remainingMs / 60000);
                        const secs = Math.floor((remainingMs % 60000) / 1000);
                        const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                        titleEl.innerText = `Akses Terkunci Sementara (${timeStr})`;
                        descEl.innerText = `Terlalu banyak percobaan sandi yang keliru. Silakan tunggu hingga hitung mundur selesai sebelum mencoba kembali.`;
                        btnLabel.innerText = `Terkunci (${timeStr})`;
                    }
                }, 1000);

                return true;
            }

            banner.classList.add('hidden');
            btnSubmit.disabled = false;
            pinInput.disabled = false;
            btnLabel.innerText = activeTenant.isSinglePage ? "Buka Portal Partner" : "Masuk ke Sistem";
            return false;
        }

        function registerFailedAttempt() {
            const state = getSecurityState();
            state.fails += 1;
            const now = Date.now();

            if (state.tier === 0 && state.fails >= 3) {
                state.tier = 1;
                state.fails = 0;
                state.lockUntil = now + (5 * 60 * 1000);
                alert("Kesalahan sandi 3x! Akses Anda dikunci sementara selama 5 menit.");
            } else if (state.tier === 1 && state.fails >= 5) {
                state.tier = 2;
                state.fails = 0;
                state.lockUntil = now + (10 * 60 * 1000);
                alert("Kesalahan sandi 5x! Akses Anda dikunci sementara selama 10 menit.");
            } else if (state.tier === 2 && state.fails >= 10) {
                state.isBlocked = true;
                state.lockUntil = 0;
                alert("Peringatan Keamanan: Akun UMKM ini telah terblokir permanen karena 10x kesalahan sandi berturut-turut.\n\nSilakan hubungi penyedia platform untuk membuka akun.");
            } else {
                const max = state.tier === 0 ? 3 : (state.tier === 1 ? 5 : 10);
                alert(`Password / PIN Salah! (${state.fails}/${max} percobaan).`);
            }

            setSecurityState(state);
            checkLockoutStatus();
        }

        // Tenant klien tidak ada di dropdown (dropdown disembunyikan), jadi ambil dari ?toko=
        function lookupTenant(key) {
            if (TENANTS_CONFIG[key]) return TENANTS_CONFIG[key];
            if (key === '__notfound__') return getActiveTenant();
            return TENANTS_CONFIG["id26110901"];
        }

        function resolveTenantKey(picker) {
            const p = (urlParams.get('toko') || '').toLowerCase().trim();
            const pickerHidden = picker && picker.classList.contains('hidden');
            if (pickerHidden && p && typeof TENANTS_CONFIG !== 'undefined' && TENANTS_CONFIG[p]) return p;
            if (pickerHidden && p) return '__notfound__';
            return picker ? picker.value : "id26110901";
        }

        function selectRole(role) {
            currentRole = role;
            ['staff', 'manager', 'owner'].forEach(r => {
                const b = document.getElementById(`role-btn-${r}`);
                if (b) {
                    if (r === role) {
                        b.className = r === 'manager' 
                            ? "py-2.5 px-2 rounded-2xl text-xs font-black border-2 border-purple-500 bg-purple-50 text-purple-900 shadow-sm"
                            : r === 'owner'
                            ? "py-2.5 px-2 rounded-2xl text-xs font-black border-2 border-amber-500 bg-amber-50 text-amber-900 shadow-sm"
                            : "py-2.5 px-2 rounded-2xl text-xs font-black border-2 border-cyan-500 bg-cyan-50 text-cyan-900 shadow-sm";
                    } else {
                        b.className = "py-2.5 px-2 rounded-2xl text-xs font-bold border-2 border-slate-200 bg-white/70 text-slate-600 hover:border-slate-300";
                    }
                }
            });
            document.getElementById('input-pin').value = "";
            document.getElementById('input-pin').focus();
            refreshAdminPicker();
        }

        function refreshAdminPicker() {
            const wrap = document.getElementById('admin-pick-wrap'), sel = document.getElementById('admin-pick');
            if (!wrap || !sel) return;
            wrap.classList.add('hidden');
            if (currentRole !== 'staff' || !window.FM_AUTH || !FM_AUTH.admins) return;
            let tk = ''; try { tk = lookupTenant(resolveTenantKey(document.getElementById('tenant-picker'))).id || ''; } catch (e) {}
            if (!tk) return;
            Promise.all([FM_AUTH.admins(tk), FM_AUTH.mainOff ? FM_AUTH.mainOff(tk).catch(function () { return false; }) : false]).then(function (res) {
                const list = res[0], off = !!res[1];
                if (currentRole !== 'staff' || !list.length) return;
                const prev = sel.value;
                sel.innerHTML = (off ? '' : '<option value="">Admin utama</option>') + list.map(function (a) { return '<option value="' + a.slot + '">' + String(a.name).replace(/[&<>"]/g, '') + (a.biz ? ' — ' + String(a.biz).replace(/[&<>"]/g, '') : '') + '</option>'; }).join('');
                if (prev) sel.value = prev;
                wrap.classList.remove('hidden');
            });
        }
        setTimeout(refreshAdminPicker, 1500);

        function setLoginBrand(tn) {
            const h = document.getElementById('login-brand'), trig = document.getElementById('login-logo-trigger');
            if (!h || !trig) return;
            if (!h.getAttribute('data-lock')) {
                const oldWrap = trig.parentElement;
                h.setAttribute('data-lock', '1');
                h.innerHTML = '<span id="login-brand-text"></span>';
                h.insertBefore(trig, h.firstChild);
                trig.className = 'relative flex items-center justify-center select-none cursor-pointer shrink-0';
                ['width', 'height'].forEach(function (p) { trig.style.setProperty(p, '48px', 'important'); });
                h.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:11px;margin-top:0;font-size:30px;font-weight:700;letter-spacing:-.012em;line-height:1';
                if (oldWrap && oldWrap !== h && !oldWrap.querySelector('#login-logo-trigger') && oldWrap.parentElement) oldWrap.style.display = 'none';
            }
            const t = (tn && tn.tier === 'pro') ? 'plus' : ((tn && tn.tier) || 'basic');
            const tx = document.getElementById('login-brand-text');
            if (tx) tx.innerHTML = 'oneilverse' + ((t === 'plus' && window.FM_LOGO) ? FM_LOGO.plus() : '');
        }

        function applyTenantBranding(tn) {
            const trig = document.getElementById('login-logo-trigger');
            if (!trig) return;
            const svg = trig.querySelector('svg');
            let badge = document.getElementById('login-logo-badge');
            // logo Oneilverse selalu tampil (menggantikan nama & gambar profil toko)
            if (svg) svg.style.display = '';
            if (badge) badge.style.display = 'none';
            setLoginBrand(tn);
            document.documentElement.classList.add('fm-br');
            const pin = document.getElementById('input-pin');
            const btn = document.getElementById('btn-login-submit');
            if (tn && tn.notFound) { if (pin) pin.disabled = true; if (btn) btn.disabled = true; if (typeof checkFormerStore === 'function' && !window.__formerChecked) { window.__formerChecked = true; checkFormerStore(); } }
        }

        function onTenantPickerChange(key) {
            activeTenant = lookupTenant(key);
            tenantKey = activeTenant.id;
            const singlePageMode = activeTenant && activeTenant.isSinglePage;

            document.getElementById('input-tenant-id').value = tenantKey;
            document.getElementById('login-sub').innerText = activeTenant.slogan;
            document.title = activeTenant.notFound ? 'Toko tidak ditemukan' : (activeTenant.nama + ' - Masuk');
            applyTenantBranding(activeTenant);

            const roleGrid = document.getElementById('role-buttons-grid');
            const partnerPill = document.getElementById('partner-view-pill');
            const btnLabel = document.getElementById('btn-login-label');
            const typeTag = document.getElementById('tenant-type-tag');

            if (singlePageMode) {
                roleGrid.classList.add('hidden');
                partnerPill.classList.remove('hidden');
                btnLabel.innerText = "Buka Portal Partner";
                typeTag.innerText = "Partner Portal";
                typeTag.className = "text-[9px] font-black px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-300 font-mono shadow-xs";
            } else {
                roleGrid.classList.remove('hidden');
                partnerPill.classList.add('hidden');
                btnLabel.innerText = "Masuk ke Sistem";
                typeTag.innerText = activeTenant.isMaster ? "Master Engine" : "Mitra UMKM";
                typeTag.className = "text-[9px] font-black px-2.5 py-0.5 rounded-full bg-cyan-100 text-cyan-800 border border-cyan-300 font-mono shadow-xs";
            }

            document.getElementById('input-pin').value = "";
            document.getElementById('input-pin').focus();
            checkLockoutStatus();
        }

        function completeLogin(userObj, targetUrl, param) {
            const state = getSecurityState();
            state.fails = 0; state.tier = 0; state.lockUntil = 0;
            setSecurityState(state);
            localStorage.setItem('currentUser', JSON.stringify(userObj));
            localStorage.setItem('auth_role', userObj.role);
            localStorage.setItem('auth_title', userObj.title);
            window.location.href = targetUrl + param;
        }

        function handleLogin() {
            const picker = document.getElementById('tenant-picker');
            const selectedKey = resolveTenantKey(picker);
            activeTenant = lookupTenant(selectedKey);
            if (activeTenant.notFound) return alert("Toko tidak ditemukan. Periksa link toko Anda dan pastikan perangkat terhubung internet.");
            tenantKey = activeTenant.id;
            const singlePageMode = activeTenant && activeTenant.isSinglePage;
            const currentTokoParam = `?toko=${encodeURIComponent(selectedKey)}`;

            if (checkLockoutStatus()) return;

            const pin = document.getElementById('input-pin').value.trim();
            if (!pin) return alert("Masukkan Password / PIN!");

            const role = singlePageMode ? 'partner' : currentRole;
            const btn = document.getElementById('btn-login-submit');
            if (btn.disabled) return;
            btn.disabled = true;
            const done = function () { btn.disabled = false; };
            if (!window.FM_AUTH) { done(); return alert("Modul keamanan belum termuat. Periksa internet lalu muat ulang halaman."); }

            const adminSlot = (role === 'staff' && !document.getElementById('admin-pick-wrap').classList.contains('hidden')) ? document.getElementById('admin-pick').value : '';
            FM_AUTH.login(tenantKey, role, pin, adminSlot).then(function (r) {
                done();
                if (r.legacy) return alert("Akun login untuk peran ini belum diaktifkan. Hubungi provider (Tower Kontrol).");
                if (!r.ok) {
                    if (r.reason === 'bad') return registerFailedAttempt();
                    return alert(FM_AUTH.errText(r.reason));
                }
                const customRoles = JSON.parse(localStorage.getItem('fm_custom_role_names') || "{}");
                let userObj, targetUrl;
                if (role === 'partner') { userObj = { role: 'partner', title: 'Partner Pemantau', tenantId: tenantKey }; targetUrl = "partner.html"; }
                else if (role === 'staff') { const ac = r.access || {}; userObj = { role: 'staff', title: ac.name || customRoles.staff || 'Admin', permissions: ['kasir'], slot: ac.slot || '', biz: ac.biz || '' }; targetUrl = "kasir.html"; }
                else if (role === 'manager') { userObj = { role: 'manager', title: customRoles.manager || 'Supervisor / Manager', permissions: ['manager'] }; targetUrl = "manager.html"; }
                else { userObj = { role: 'owner', title: customRoles.owner || 'Owner Eksekutif', permissions: ['all'] }; targetUrl = "dashboard.html"; }
                completeLogin(userObj, targetUrl, currentTokoParam);
            });
        }

        // EASTER EGG: 7X TAP PADA LOGO ON UNTUK BUKA SUPERADMIN (TERSEMBUNYI)
        let tapCount = 0;
        let tapTimer = null;

        function setupEasterEgg() {
            const logo = document.getElementById('login-logo-trigger');
            if (!logo) return;

            logo.addEventListener('click', () => {
                tapCount++;
                clearTimeout(tapTimer);

                if (tapCount >= 7) {
                    tapCount = 0;
                    document.getElementById('modal-provider-override').classList.remove('hidden');
                    document.getElementById('input-prov-secret').value = "";
                    document.getElementById('input-prov-email').focus();
                    return;
                }

                tapTimer = setTimeout(() => { tapCount = 0; }, 1600);
            });
        }

        function verifyProviderSecret() {
            const em = document.getElementById('input-prov-email').value.trim();
            const secret = document.getElementById('input-prov-secret').value.trim();
            const enter = function () {
                const prov = { role: 'superadmin', title: 'Platform Provider' };
                localStorage.setItem('currentUser', JSON.stringify(prov));
                localStorage.setItem('auth_role', 'superadmin');
                window.location.replace("provider.html");
            };
            if (!em) { alert("Masukkan email dan sandi Tower."); return; }
            if (!window.FM_AUTH) return alert("Modul keamanan belum termuat. Periksa internet lalu muat ulang halaman.");
            FM_AUTH.loginTower(em, secret).then(function (r) {
                if (r.ok) return enter();
                alert(FM_AUTH.errText(r.reason));
            });
        }

        function closeProviderModal() {
            document.getElementById('modal-provider-override').classList.add('hidden');
        }

        // 20 BERITA TIAP 15 MENIT
        const newsList = [
            "IHSG Ditutup Menguat 1.2%, Sektor Teknologi Memimpin",
            "Bank Indonesia Pertahankan Suku Bunga Acuan di Level 6.00%",
            "Harga Minyak Dunia Melonjak Akibat Ketegangan Geopolitik",
            "Rilis Fitur AI Baru, Saham Tech Global Naik Tajam",
            "Pemerintah Siapkan Insentif Pajak Baru untuk UMKM Digital",
            "Nilai Tukar Rupiah Stabil di Kisaran Rp 15.885 / USD",
            "Investasi Asing Kuartal III Meningkat 25%",
            "Harga Emas Antam Sentuh Rekor Tertinggi Baru Rp 1.528.000/g",
            "Pembangunan Infrastruktur Cloud di Indonesia Makin Pesat",
            "Startup Lokal Terima Pendanaan Seri B Senilai 500 Miliar",
            "Bursa Asia Kompak Menghijau Mengikuti Wall Street",
            "Penerimaan Pajak Negara Melampaui Target Tahun Ini",
            "Adopsi Pembayaran QRIS Tembus 45 Juta Pengguna",
            "Sektor Pariwisata Kembali Pulih 100% Pasca Pandemi",
            "Ekspor Manufaktur Naik, Neraca Perdagangan Surplus",
            "Fenomena El Nino Diprediksi Berakhir Bulan Depan",
            "KTT Ekonomi ASEAN Hasilkan Kesepakatan Perdagangan Bebas Baru",
            "Tren Belanja Online Konsumen Meningkat Jelang Akhir Tahun",
            "Raksasa Teknologi Resmikan Data Center Terbesar di Jawa Barat",
            "Bank Digital Lokal Catat Pertumbuhan Laba 200%"
        ];

        function renderTicker() {
            const container = document.getElementById('news-content');
            if (container) {
                container.innerHTML = newsList.map(n => `<span class="mx-6 text-cyan-400 font-bold">•</span><span>${n}</span>`).join('');
            }
        }

        document.getElementById('input-pin').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            const paramToko = urlParams.get('toko');
            const picker = document.getElementById('tenant-picker');
            const lockedInput = document.getElementById('input-tenant-id');

            if (paramToko && !['id26110901', 'id261110b', 'id261110a', 'oneilverse'].includes(paramToko.toLowerCase())) {
                picker.classList.add('hidden');
                lockedInput.classList.remove('hidden');
                lockedInput.value = activeTenant.id;
            } else if (paramToko) {
                if (picker) picker.value = paramToko.toLowerCase();
            }

            const selectedKey = resolveTenantKey(picker);
            onTenantPickerChange(selectedKey);

            setupEasterEgg();
            checkLockoutStatus();
            renderTicker();
            setInterval(() => {
                newsList.unshift(`Berita Baru Terupdate ${new Date().toLocaleTimeString('id-ID')}`);
                if (newsList.length > 20) newsList.pop();
                renderTicker();
            }, 900000);
        });
    </script>
    <script>
        /* Rapikan alamat: index.html?toko=ID26110901 -> /ID26110901 (muat ulang tetap berfungsi lewat 404.html) */
        window.addEventListener('load', function () {
            try {
                var t = new URLSearchParams(location.search).get('toko');
                if (t && /index\.html$/.test(location.pathname) && /^[A-Za-z0-9_-]{3,40}$/.test(t)) {
                    window.__fmToko = t;
                    history.replaceState(null, '', location.pathname.replace(/index\.html$/, '') + t);
                }
            } catch (e) {}
        });
    </script>
