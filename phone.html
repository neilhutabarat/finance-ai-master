<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oneilverse</title>
<style>html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% 0,#27406b,#0b1220 70%)}body{display:flex;align-items:center;justify-content:center}
  .ph{width:430px;max-width:100vw;height:100vh;box-sizing:border-box}
iframe{width:100%;height:100%;border:0;background:transparent;display:block}</style></head>
<body><div class="ph"><iframe id="f" allow="camera;microphone;geolocation;clipboard-write"></iframe></div>
<script>
/* Bingkai tampilan HP untuk Manager/Owner di desktop. Hanya membuka halaman toko yang sama di dalam bingkai selebar HP. */
(function () {
  var u = new URLSearchParams(location.search).get('u') || '';
  if (!/^(manager|dashboard)\.html(\?[^#]*)?(#.*)?$/.test(u)) { location.replace('index.html'); return; }
  document.getElementById('f').src = u;
})();
</script></body></html>
